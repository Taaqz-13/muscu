<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Muscu</title>
<meta name="description" content="Suivi de séances de musculation, simple et flexible">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="view"></main>

<nav id="tabbar">
  <a class="tab" data-tab="seance" href="#/"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Séance</a>
  <a class="tab" data-tab="prog" href="#/programmes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Séances types</a>
  <a class="tab" data-tab="stats" href="#/stats"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Stats</a>
  <a class="tab" data-tab="hist" href="#/historique"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Historique</a>
</nav>

<div id="sheet" class="overlay"><div class="sheet-card" id="sheet-body"></div></div>

<div id="picker" class="overlay full">
  <div class="pk-card">
    <div class="pk-head">
      <b id="pk-title">Exercice</b>
      <button class="iconbtn" data-act="pk-close" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input id="pk-q" type="search" placeholder="Chercher ou créer un exercice" autocomplete="off" enterkeyhint="search">
    <div id="pk-filters" class="mfilter"></div>
    <div id="pk-list"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/seed.js"></script>
<script src="js/stats.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
